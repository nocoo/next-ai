name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      coverage-path: "coverage"
      typecheck-command: "bun run typecheck"

  e2e-examples:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        app: [next-app, vite-app]
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      pre-command: |
        bun run build
        cd "examples/${{ matrix.app }}"
        bun install --frozen-lockfile --ignore-scripts
      browser: "chromium"
      browser-working-directory: examples/${{ matrix.app }}
      command: cd "examples/${{ matrix.app }}" && bun run test:e2e
      timeout-minutes: 15
      artifact-name: playwright-report-${{ matrix.app }}
      artifact-path: examples/${{ matrix.app }}/playwright-report
      artifact-retention-days: 7
