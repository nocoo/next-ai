name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.2"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      coverage-path: "coverage"
      typecheck-command: "bun run typecheck"
    secrets: inherit

  e2e-examples:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [next-app, vite-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup root Bun and build library
        uses: nocoo/base-ci/.github/actions/setup-js@ab52d72877d386c9a8fd224e9ac868e88be90539
        with:
          package-manager: "bun"
          runtime-version: "1.4.2"
          install-policy: "blocked"
      - name: Build root library
        run: bun run build
      - name: Setup example dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ab52d72877d386c9a8fd224e9ac868e88be90539
        with:
          package-manager: "bun"
          runtime-version: "1.4.2"
          working-directory: examples/${{ matrix.app }}
          install-policy: "blocked"
      - if: matrix.app == 'next-app'
        run: bun run build
        working-directory: examples/${{ matrix.app }}
      - run: bunx playwright install --with-deps chromium
        working-directory: examples/${{ matrix.app }}
      - run: bunx playwright test
        working-directory: examples/${{ matrix.app }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.app }}
          path: examples/${{ matrix.app }}/playwright-report
          retention-days: 7
